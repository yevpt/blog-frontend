# 博客前端 Web 服务
# 使用前：在服务器的 web 目录创建 .env，并填写 API_BASE_URL 等运行时变量。

services:
  blog-web:
    image: ${BLOG_WEB_IMAGE:?BLOG_WEB_IMAGE is required}
    container_name: blog-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: ${API_BASE_URL}
      BLOG_USER_ID: ${BLOG_USER_ID:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
