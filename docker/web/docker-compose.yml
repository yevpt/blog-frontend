# 博客前端 Web 服务
# 使用前：在服务器的 web 目录创建 .env，并填写 API_BASE_URL 等运行时变量。

services:
  blog-web:
    # BLOG_WEB_IMAGE 由部署脚本写入 .deploy.env，格式示例：
    # krccr.ccs.tencentyun.com/yevpt/blog-frontend-web:<commit-sha>
    image: ${BLOG_WEB_IMAGE}
    container_name: ${COMPOSE_CONTAINER_NAME:-blog-web}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: ${API_BASE_URL}
      BLOG_USER_ID: ${BLOG_USER_ID:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
