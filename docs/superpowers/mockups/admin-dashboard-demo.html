<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard Demo</title>
    <style>
      :root {
        color-scheme: light;
        --background: #fbfbfc;
        --foreground: #18181b;
        --card: #ffffff;
        --muted: #f4f4f5;
        --muted-foreground: #71717a;
        --border: rgba(24, 24, 27, 0.08);
        --input: rgba(24, 24, 27, 0.1);
        --primary: #7c3aed;
        --primary-foreground: #ffffff;
        --destructive: #ef4444;
        --ring: rgba(124, 58, 237, 0.24);
        --shadow-sm: 0 1px 2px rgba(24, 24, 27, 0.05);
        --shadow: 0 10px 34px rgba(24, 24, 27, 0.07);
      }

      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          color-scheme: dark;
          --background: #09090b;
          --foreground: #fafafa;
          --card: #121214;
          --muted: #27272a;
          --muted-foreground: #a1a1aa;
          --border: rgba(255, 255, 255, 0.09);
          --input: rgba(255, 255, 255, 0.1);
          --primary: #a78bfa;
          --primary-foreground: #09090b;
          --destructive: #f87171;
          --ring: rgba(167, 139, 250, 0.3);
          --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
          --shadow: 0 10px 34px rgba(0, 0, 0, 0.32);
        }
      }

      :root.dark {
        color-scheme: dark;
        --background: #09090b;
        --foreground: #fafafa;
        --card: #121214;
        --muted: #27272a;
        --muted-foreground: #a1a1aa;
        --border: rgba(255, 255, 255, 0.09);
        --input: rgba(255, 255, 255, 0.1);
        --primary: #a78bfa;
        --primary-foreground: #09090b;
        --destructive: #f87171;
        --ring: rgba(167, 139, 250, 0.3);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow: 0 10px 34px rgba(0, 0, 0, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--background);
        color: var(--foreground);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      svg {
        stroke: currentColor;
        stroke-width: 1.85;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      /* ---------------- 布局骨架 ---------------- */
      .app {
        display: flex;
        min-height: 100dvh;
      }

      /* ---------------- 侧栏 ---------------- */
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 40;
        display: flex;
        width: 248px;
        flex-direction: column;
        background: var(--card);
        border-right: 1px solid var(--border);
        transition: transform 220ms cubic-bezier(0.32, 0.72, 0, 1);
      }

      .sidebar-head {
        display: flex;
        align-items: center;
        gap: 11px;
        height: 64px;
        padding: 0 20px;
        border-bottom: 1px solid var(--border);
      }

      .brand-logo {
        width: 30px;
        height: 30px;
        flex: none;
      }
      .brand-logo .primary {
        fill: var(--primary);
        stroke: none;
      }
      .brand-logo .secondary {
        fill: var(--foreground);
        stroke: none;
      }
      .brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1.15;
      }
      .brand-name {
        font-size: 15px;
        font-weight: 760;
        letter-spacing: 0.04em;
      }
      .brand-sub {
        font-size: 11px;
        color: var(--muted-foreground);
        letter-spacing: 0.02em;
      }

      .nav {
        flex: 1;
        overflow-y: auto;
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .nav-group-label {
        padding: 14px 12px 6px;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 9px 12px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--foreground);
        font-size: 14px;
        font-weight: 500;
        text-align: left;
        transition:
          background 150ms ease,
          color 150ms ease;
      }
      .nav-item svg {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .nav-item:hover {
        background: color-mix(in srgb, var(--foreground) 5%, transparent);
      }
      .nav-item.active {
        background: color-mix(in srgb, var(--primary) 12%, transparent);
        color: var(--primary);
        font-weight: 620;
      }
      .nav-item .badge {
        margin-left: auto;
        font-size: 11px;
        font-weight: 650;
        padding: 1px 7px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--foreground) 7%, transparent);
        color: var(--muted-foreground);
      }
      .nav-item.active .badge {
        background: color-mix(in srgb, var(--primary) 18%, transparent);
        color: var(--primary);
      }

      .sidebar-foot {
        padding: 10px 12px 12px;
        border-top: 1px solid var(--border);
      }
      .collapse-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 12px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--muted-foreground);
        font-size: 13px;
      }
      .collapse-btn:hover {
        background: color-mix(in srgb, var(--foreground) 5%, transparent);
        color: var(--foreground);
      }
      .collapse-btn svg {
        width: 16px;
        height: 16px;
      }

      /* 侧栏底部用户区 */
      .user-area {
        position: relative;
        margin-top: 6px;
      }
      .user-row {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 8px 8px 10px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: transparent;
        color: var(--foreground);
        text-align: left;
        transition:
          background 150ms ease,
          border-color 150ms ease;
      }
      .user-row:hover {
        background: color-mix(in srgb, var(--foreground) 5%, transparent);
        border-color: color-mix(in srgb, var(--foreground) 14%, var(--border));
      }
      .user-row .avatar {
        flex: none;
      }
      .user-meta {
        display: flex;
        flex-direction: column;
        min-width: 0;
        line-height: 1.25;
      }
      .user-meta b {
        font-size: 13.5px;
        font-weight: 640;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .user-meta span {
        font-size: 11.5px;
        color: var(--muted-foreground);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .user-row .more {
        margin-left: auto;
        color: var(--muted-foreground);
      }
      .user-row .more svg {
        width: 16px;
        height: 16px;
      }
      .user-row .more svg circle {
        fill: currentColor;
        stroke: none;
      }
      .user-menu {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 56px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        box-shadow: var(--shadow);
      }

      /* ---------------- 主区 ---------------- */
      .main {
        flex: 1;
        min-width: 0;
        margin-left: 248px;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 64px;
        padding: 0 24px;
        background: color-mix(in srgb, var(--card) 80%, transparent);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }

      .icon-btn {
        display: inline-flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--foreground);
        transition:
          background 150ms ease,
          color 150ms ease;
      }
      .icon-btn:hover {
        background: color-mix(in srgb, var(--foreground) 6%, transparent);
        color: var(--primary);
      }
      .icon-btn svg {
        width: 20px;
        height: 20px;
      }

      .hamburger {
        display: none;
      }

      .page-title {
        font-size: 16px;
        font-weight: 680;
      }
      .topbar-spacer {
        flex: 1;
      }

      .theme-moon {
        display: none;
      }
      :root.dark .theme-sun {
        display: none;
      }
      :root.dark .theme-moon {
        display: block;
      }
      @media (prefers-color-scheme: dark) {
        :root:not(.light) .theme-sun {
          display: none;
        }
        :root:not(.light) .theme-moon {
          display: block;
        }
      }

      /* 头像 + 菜单 */
      .user {
        position: relative;
      }
      .avatar {
        display: inline-flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: color-mix(in srgb, var(--primary) 14%, var(--card));
        color: var(--primary);
        font-size: 14px;
        font-weight: 700;
      }
      .menu {
        position: absolute;
        top: 48px;
        right: 0;
        width: 232px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .menu-head {
        padding: 10px 10px 12px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 6px;
      }
      .menu-name {
        font-size: 14px;
        font-weight: 650;
      }
      .menu-mail {
        margin-top: 2px;
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 10px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--foreground);
        font-size: 13.5px;
        text-align: left;
      }
      .menu-item:hover {
        background: color-mix(in srgb, var(--foreground) 6%, transparent);
      }
      .menu-item svg {
        width: 17px;
        height: 17px;
      }
      .menu-item.danger {
        color: var(--destructive);
      }
      .menu-item.danger:hover {
        background: color-mix(in srgb, var(--destructive) 12%, transparent);
      }

      /* ---------------- 内容 ---------------- */
      .content {
        padding: 28px 24px 48px;
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
      }

      .welcome {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      .welcome h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 740;
        letter-spacing: -0.01em;
      }
      .welcome p {
        margin: 7px 0 0;
        font-size: 14px;
        color: var(--muted-foreground);
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 42px;
        padding: 0 18px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: var(--primary-foreground);
        font-size: 14px;
        font-weight: 680;
        transition:
          filter 150ms ease,
          transform 120ms ease;
      }
      .btn-primary:hover {
        filter: brightness(1.04);
      }
      .btn-primary:active {
        transform: scale(0.98);
      }
      .btn-primary svg {
        width: 17px;
        height: 17px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 24px;
      }
      .stat {
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        box-shadow: var(--shadow-sm);
      }
      .stat-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .stat-icon {
        display: inline-flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        border-radius: 11px;
        background: color-mix(in srgb, var(--primary) 12%, transparent);
        color: var(--primary);
      }
      .stat-icon svg {
        width: 19px;
        height: 19px;
      }
      .stat-trend {
        font-size: 12px;
        font-weight: 620;
        color: #16a34a;
      }
      :root.dark .stat-trend {
        color: #4ade80;
      }
      .stat-num {
        margin-top: 14px;
        font-size: 28px;
        font-weight: 760;
        letter-spacing: -0.02em;
      }
      .stat-label {
        margin-top: 2px;
        font-size: 13px;
        color: var(--muted-foreground);
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1.7fr 1fr;
        gap: 16px;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
      }
      .card-title {
        font-size: 15px;
        font-weight: 680;
      }
      .card-link {
        font-size: 13px;
        color: var(--primary);
        font-weight: 600;
        background: none;
        border: 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      thead th {
        padding: 10px 18px;
        text-align: left;
        font-size: 11.5px;
        font-weight: 620;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted-foreground);
        background: color-mix(in srgb, var(--foreground) 3%, transparent);
      }
      tbody td {
        padding: 12px 18px;
        border-top: 1px solid var(--border);
      }
      .t-title {
        font-weight: 580;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 620;
      }
      .pill.pub {
        background: color-mix(in srgb, var(--primary) 14%, transparent);
        color: var(--primary);
      }
      .pill.draft {
        background: color-mix(in srgb, var(--foreground) 8%, transparent);
        color: var(--muted-foreground);
      }
      .t-muted {
        color: var(--muted-foreground);
      }

      .quick {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
      }
      .quick-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: transparent;
        color: var(--foreground);
        text-align: left;
        transition:
          border-color 150ms ease,
          background 150ms ease;
      }
      .quick-item:hover {
        border-color: color-mix(in srgb, var(--primary) 40%, var(--border));
        background: color-mix(in srgb, var(--primary) 5%, transparent);
      }
      .quick-ic {
        display: inline-flex;
        width: 34px;
        height: 34px;
        flex: none;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: color-mix(in srgb, var(--primary) 12%, transparent);
        color: var(--primary);
      }
      .quick-ic svg {
        width: 17px;
        height: 17px;
      }
      .quick-tx b {
        display: block;
        font-size: 13.5px;
        font-weight: 620;
      }
      .quick-tx span {
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .quick-arrow {
        margin-left: auto;
        color: var(--muted-foreground);
      }
      .quick-arrow svg {
        width: 16px;
        height: 16px;
      }

      /* 遮罩 */
      .scrim {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 35;
        background: rgba(0, 0, 0, 0.45);
      }

      /* ---------------- 响应式 ---------------- */
      @media (max-width: 1024px) {
        .grid-2 {
          grid-template-columns: 1fr;
        }
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 768px) {
        .sidebar {
          transform: translateX(-100%);
          box-shadow: var(--shadow);
        }
        body.nav-open .sidebar {
          transform: translateX(0);
        }
        body.nav-open .scrim {
          display: block;
        }
        .main {
          margin-left: 0;
        }
        .hamburger {
          display: inline-flex;
        }
        .topbar {
          padding: 0 14px;
        }
        .content {
          padding: 20px 14px 40px;
        }
        .stats {
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
        }
        .stat-num {
          font-size: 24px;
        }
        .welcome h1 {
          font-size: 21px;
        }
        .table-wrap {
          overflow-x: auto;
        }
        table {
          min-width: 540px;
        }
      }

      @media (max-width: 420px) {
        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- 遮罩（移动端） -->
      <div class="scrim" id="scrim"></div>

      <!-- 侧栏 -->
      <aside class="sidebar">
        <div class="sidebar-head">
          <svg class="brand-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g transform="translate(256, 256) rotate(-45)">
              <path class="primary" d="M 20 -180 A 180 180 0 0 1 20 180 C -120 180 160 -180 20 -180 Z" />
              <path class="secondary" d="M -20 180 A 180 180 0 0 1 -20 -180 C 120 -180 -160 180 -20 180 Z" />
            </g>
          </svg>
          <div class="brand-text">
            <span class="brand-name">YEVPT</span>
            <span class="brand-sub">管理后台</span>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5" /><path d="M5 10v9h14v-9" /></svg>
            概览
          </button>

          <div class="nav-group-label">内容</div>
          <button class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M5 19h14" /><path d="M14.5 4.5l4 4L8 19l-4.5 1 1-4.5Z" /></svg>
            文章<span class="badge">128</span>
          </button>
          <button class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h6a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" /></svg>
            分类<span class="badge">9</span>
          </button>
          <button class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M4 4h7l9 9-7 7-9-9Z" /><circle cx="8.5" cy="8.5" r="1.5" /></svg>
            标签<span class="badge">42</span>
          </button>

          <div class="nav-group-label">站点</div>
          <button class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="17" cy="16" r="3" /></svg>
            音乐<span class="badge">23</span>
          </button>
          <button class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10 13a4 4 0 0 0 5.66 0l3-3A4 4 0 1 0 13 4.34l-1.5 1.5" /><path d="M14 11a4 4 0 0 0-5.66 0l-3 3A4 4 0 1 0 11 19.66l1.5-1.5" /></svg>
            友链<span class="badge">16</span>
          </button>
        </nav>

        <div class="sidebar-foot">
          <button class="collapse-btn">
            <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg>
            收起侧栏
          </button>

          <div class="user-area">
            <div class="menu user-menu" id="userMenu" style="display: none;">
              <div class="menu-head">
                <div class="menu-name">Yevpt</div>
                <div class="menu-mail">admin@yevpt.com</div>
              </div>
              <button class="menu-item">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 20c0-4 4-6 8-6s8 2 8 6" /></svg>
                个人设置
              </button>
              <button class="menu-item danger">
                <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3" /><path d="M10 17l-5-5 5-5" /><path d="M5 12h12" /></svg>
                退出登录
              </button>
            </div>

            <button class="user-row" id="avatarBtn" aria-label="用户菜单">
              <span class="avatar">YV</span>
              <span class="user-meta">
                <b>Yevpt</b>
                <span>admin@yevpt.com</span>
              </span>
              <span class="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4" /><circle cx="12" cy="12" r="1.4" /><circle cx="12" cy="19" r="1.4" /></svg></span>
            </button>
          </div>
        </div>
      </aside>

      <!-- 主区 -->
      <div class="main">
        <header class="topbar">
          <button class="icon-btn hamburger" id="hamburger" aria-label="打开菜单">
            <svg viewBox="0 0 24 24"><path d="M4 6h16" /><path d="M4 12h16" /><path d="M4 18h16" /></svg>
          </button>
          <span class="page-title">概览</span>

      const root = document.documentElement;
      document.getElementById("themeToggle").addEventListener("click", () => {
        const dark = root.classList.contains("dark");
        root.classList.remove("dark", "light");
        root.classList.add(dark ? "light" : "dark");
      });

      const body = document.body;
      document.getElementById("hamburger").addEventListener("click", () => body.classList.add("nav-open"));
      document.getElementById("scrim").addEventListener("click", () => body.classList.remove("nav-open"));

      const menu = document.getElementById("userMenu");
      document.getElementById("avatarBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        menu.style.display = menu.style.display === "none" ? "block" : "none";
      });
      document.addEventListener("click", () => (menu.style.display = "none"));
