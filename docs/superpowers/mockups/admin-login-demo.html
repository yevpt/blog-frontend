<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login Demo</title>
    <style>
      :root {
        color-scheme: light;
        --background: #fbfbfc;
        --foreground: #18181b;
        --card: #ffffff;
        --muted: #f4f4f5;
        --muted-foreground: #71717a;
        --border: rgba(24, 24, 27, 0.08);
        --input: rgba(24, 24, 27, 0.1);
        --primary: #7c3aed;
        --primary-foreground: #ffffff;
        --ring: rgba(124, 58, 237, 0.24);
        --shadow: 0 18px 54px rgba(24, 24, 27, 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          color-scheme: dark;
          --background: #09090b;
          --foreground: #fafafa;
          --card: #18181b;
          --muted: #27272a;
          --muted-foreground: #a1a1aa;
          --border: rgba(255, 255, 255, 0.09);
          --input: rgba(255, 255, 255, 0.1);
          --primary: #a78bfa;
          --primary-foreground: #09090b;
          --ring: rgba(167, 139, 250, 0.3);
          --shadow: 0 18px 54px rgba(0, 0, 0, 0.28);
        }
      }

      :root.dark {
        color-scheme: dark;
        --background: #09090b;
        --foreground: #fafafa;
        --card: #18181b;
        --muted: #27272a;
        --muted-foreground: #a1a1aa;
        --border: rgba(255, 255, 255, 0.09);
        --input: rgba(255, 255, 255, 0.1);
        --primary: #a78bfa;
        --primary-foreground: #09090b;
        --ring: rgba(167, 139, 250, 0.3);
        --shadow: 0 18px 54px rgba(0, 0, 0, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--primary) 8%, transparent), transparent 34rem),
          var(--background);
        color: var(--foreground);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .page {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
      }

      .login {
        width: min(100%, 408px);
      }

      .site-brand {
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 10;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--foreground);
      }

      .brand-logo-frame {
        display: inline-flex;
        width: 36px;
        height: 36px;
        align-items: center;
        justify-content: center;
      }

      .brand-logo {
        width: 26px;
        height: 26px;
      }

      .brand-logo .primary {
        fill: var(--primary);
      }

      .brand-logo .secondary {
        fill: var(--foreground);
      }

      .site-title {
        font-size: 14px;
        font-weight: 760;
        letter-spacing: 0.06em;
        line-height: 36px;
      }

      .theme-toggle {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 10;
        display: inline-flex;
        width: 36px;
        height: 36px;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--foreground);
        cursor: pointer;
        transition:
          color 160ms ease,
          background 160ms ease,
          transform 160ms ease;
      }

      .theme-toggle:hover {
        background: color-mix(in srgb, var(--foreground) 6%, transparent);
        color: var(--primary);
      }

      .theme-toggle:active {
        transform: scale(0.97);
      }

      .theme-icon {
        display: inline-flex;
        width: 20px;
        height: 20px;
        align-items: center;
        justify-content: center;
      }

      .theme-icon svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .theme-moon {
        display: none;
      }

      .theme-toggle[data-theme="dark"] .theme-sun {
        display: none;
      }

      .theme-toggle[data-theme="dark"] .theme-moon {
        display: block;
      }

      .card {
        border: 1px solid color-mix(in srgb, var(--border) 88%, transparent);
        border-radius: 22px;
        background: color-mix(in srgb, var(--card) 96%, transparent);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .header {
        padding: 40px 36px 24px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 760;
        letter-spacing: 0;
        line-height: 1.2;
      }

      .header p {
        margin: 9px 0 0;
        color: var(--muted-foreground);
        font-size: 14px;
        line-height: 1.6;
      }

      form {
        display: grid;
        gap: 20px;
        padding: 0 36px 38px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        color: color-mix(in srgb, var(--foreground) 78%, var(--muted-foreground));
        font-size: 12px;
        font-weight: 650;
      }

      .input-wrap {
        position: relative;
      }

      input {
        width: 100%;
        height: 42px;
        border: 1px solid var(--input);
        border-radius: 12px;
        outline: none;
        background: color-mix(in srgb, var(--card) 72%, var(--background));
        color: var(--foreground);
        padding: 0 12px;
        font-size: 15px;
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease,
          background 160ms ease;
      }

      input::placeholder {
        color: color-mix(in srgb, var(--muted-foreground) 68%, transparent);
      }

      input:hover {
        border-color: color-mix(in srgb, var(--foreground) 18%, var(--input));
        background: color-mix(in srgb, var(--card) 88%, var(--background));
      }

      input:focus {
        border-color: color-mix(in srgb, var(--primary) 54%, var(--input));
        background: var(--card);
        box-shadow: 0 0 0 3px var(--ring);
      }

      .password-input {
        padding-right: 43px;
      }

      .eye-button {
        position: absolute;
        top: 4px;
        right: 4px;
        display: inline-flex;
        width: 34px;
        height: 34px;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted-foreground);
        cursor: pointer;
      }

      .eye-button:hover {
        background: var(--muted);
        color: var(--foreground);
      }

      .password-icon {
        display: inline-flex;
        width: 18px;
        height: 18px;
        align-items: center;
        justify-content: center;
      }

      .password-icon svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .icon-eye-off {
        display: none;
      }

      .eye-button[data-visible="true"] .icon-eye {
        display: none;
      }

      .eye-button[data-visible="true"] .icon-eye-off {
        display: block;
      }

      .submit {
        display: inline-flex;
        height: 46px;
        align-items: center;
        justify-content: center;
        margin-top: 3px;
        margin-bottom: 2px;
        border: 0;
        border-radius: 14px;
        background: var(--primary);
        color: var(--primary-foreground);
        cursor: pointer;
        font-size: 14px;
        font-weight: 740;
        transition:
          filter 160ms ease,
          transform 160ms ease;
      }

      .submit:hover {
        filter: brightness(0.98);
      }

      .submit:active {
        transform: scale(0.99);
      }

      @media (max-width: 520px) {
        .page {
          align-items: stretch;
          padding: 0;
        }

        .login {
          display: flex;
          min-height: 100dvh;
          flex-direction: column;
          width: 100%;
        }

        .theme-toggle {
          top: 18px;
          right: 18px;
        }

        .site-brand {
          top: 18px;
          left: 18px;
        }

        .brand-logo-frame {
          width: 36px;
          height: 36px;
        }

        .brand-logo {
          width: 26px;
          height: 26px;
        }

        .site-title {
          display: none;
        }

        .card {
          display: flex;
          min-height: 100dvh;
          flex-direction: column;
          justify-content: center;
          border: 0;
          border-radius: 0;
          background: var(--background);
          box-shadow: none;
        }

        .header {
          padding: 0 28px 28px;
        }

        form {
          gap: 22px;
          padding: 0 28px 34px;
        }
      }
    </style>
  </head>
  <body>
    <div class="site-brand" aria-label="YEVPT">
      <div class="brand-logo-frame" aria-hidden="true">
        <svg class="brand-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(256, 256) rotate(-45)">
            <path
              class="primary"
              d="M 20 -180 A 180 180 0 0 1 20 180 C -120 180 160 -180 20 -180 Z"
            />
            <path
              class="secondary"
              d="M -20 180 A 180 180 0 0 1 -20 -180 C 120 -180 -160 180 -20 180 Z"
            />
          </g>
        </svg>
      </div>
      <span class="site-title">YEVPT</span>
    </div>

    <button class="theme-toggle" type="button" id="themeToggle" aria-label="切换主题">
      <span class="theme-icon" aria-hidden="true">
        <svg class="theme-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2.5v2" />
          <path d="M12 19.5v2" />
          <path d="M4.5 4.5l1.4 1.4" />
          <path d="M18.1 18.1l1.4 1.4" />
          <path d="M2.5 12h2" />
          <path d="M19.5 12h2" />
          <path d="M4.5 19.5l1.4-1.4" />
          <path d="M18.1 5.9l1.4-1.4" />
        </svg>
        <svg class="theme-moon" viewBox="0 0 24 24">
          <path d="M20.2 14.5A7.8 7.8 0 0 1 9.5 3.8 8.7 8.7 0 1 0 20.2 14.5Z" />
        </svg>
      </span>
    </button>

    <main class="page">
      <section class="login" aria-label="博客后台登录">
        <article class="card">
          <div class="header">
            <h1>登录后台</h1>
            <p>使用管理员账号继续。</p>
          </div>

          <form>
            <div class="field">
              <label for="username">用户名</label>
              <input id="username" name="username" type="text" placeholder="输入用户名" />
            </div>

            <div class="field">
              <label for="password">密码</label>
              <div class="input-wrap">
                <input
                  class="password-input"
                  id="password"
                  name="password"
                  type="password"
                  placeholder="输入密码"
                />
                <button
                  class="eye-button"
                  type="button"
                  id="passwordToggle"
                  aria-label="显示密码"
                  data-visible="false"
                >
                  <span class="password-icon" aria-hidden="true">
                    <svg class="icon-eye" viewBox="0 0 24 24">
                      <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                      <circle cx="12" cy="12" r="2.5" />
                    </svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24">
                      <path d="M3 3l18 18" />
                      <path d="M10.7 5.2A10.6 10.6 0 0 1 12 5c6 0 9.5 7 9.5 7a17.5 17.5 0 0 1-3.2 4.1" />
                      <path d="M6.1 6.6C3.8 8.3 2.5 12 2.5 12S6 19 12 19a9.8 9.8 0 0 0 4.2-.9" />
                      <path d="M10.4 10.4a2.5 2.5 0 0 0 3.2 3.2" />
                    </svg>
                  </span>
                </button>
              </div>
            </div>

            <button class="submit" type="button">登录</button>
          </form>
        </article>
      </section>
    </main>

    <script>
      const root = document.documentElement;
      const themeToggle = document.getElementById("themeToggle");
      const passwordToggle = document.getElementById("passwordToggle");
      const passwordInput = document.getElementById("password");

      function getResolvedTheme() {
        return getComputedStyle(root).colorScheme === "dark" ? "dark" : "light";
      }

      function updateThemeIcon() {
        const theme = getResolvedTheme();
        themeToggle.dataset.theme = theme;
        themeToggle.setAttribute(
          "aria-label",
          `当前生效主题：${theme}，点击切换到 ${theme === "dark" ? "light" : "dark"}`,
        );
      }

      themeToggle.addEventListener("click", () => {
        const next = getResolvedTheme() === "dark" ? "light" : "dark";
        root.classList.toggle("dark", next === "dark");
        root.classList.toggle("light", next === "light");
        updateThemeIcon();
      });

      passwordToggle.addEventListener("click", () => {
        const visible = passwordInput.type === "text";
        passwordInput.type = visible ? "password" : "text";
        passwordToggle.dataset.visible = String(!visible);
        passwordToggle.setAttribute("aria-label", visible ? "显示密码" : "隐藏密码");
      });

      updateThemeIcon();
    </script>
  </body>
</html>
