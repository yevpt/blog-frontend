name: Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: krccr.ccs.tencentyun.com
  REGISTRY_USERNAME: "462703445"
  WEB_IMAGE_NAME: krccr.ccs.tencentyun.com/yevpt/blog-frontend-web

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Check types
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

  web-image:
    name: Build and Push Web Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    outputs:
      image: ${{ env.WEB_IMAGE_NAME }}
      tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE_NAME }}:latest
            ${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  admin-artifact:
    name: Build Admin Artifact
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin
        run: pnpm --filter admin build

      - name: Pack admin dist
        run: tar -czf admin-dist.tar.gz -C apps/admin/dist .

      - name: Upload admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin-dist.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - web-image
      - admin-artifact
    if: github.event_name != 'pull_request'
    environment: production
    env:
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_PORT: ${{ vars.REMOTE_PORT }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
      WEB_IMAGE_REF: ${{ needs.web-image.outputs.image }}:${{ needs.web-image.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download admin artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist

      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          REMOTE_PORT="${REMOTE_PORT:-22}"
          ssh-keyscan -p "$REMOTE_PORT" "$REMOTE_HOST" >> ~/.ssh/known_hosts

      - name: Sync deploy files
        run: |
          set -euo pipefail
          REMOTE_PORT="${REMOTE_PORT:-22}"
          DEPLOY_ROOT="${DEPLOY_ROOT:-/root/docker/blog-frontend}"
          ssh -i ~/.ssh/deploy_key -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" \
            "mkdir -p '$DEPLOY_ROOT/web' '$DEPLOY_ROOT/admin'"
          scp -i ~/.ssh/deploy_key -P "$REMOTE_PORT" docker/web/docker-compose.yml \
            "$REMOTE_USER@$REMOTE_HOST:$DEPLOY_ROOT/web/docker-compose.yml"
          scp -i ~/.ssh/deploy_key -P "$REMOTE_PORT" admin-dist.tar.gz \
            "$REMOTE_USER@$REMOTE_HOST:$DEPLOY_ROOT/admin/admin-dist.tar.gz"

      - name: Deploy with Docker Compose and static files
        run: |
          set -euo pipefail
          REMOTE_PORT="${REMOTE_PORT:-22}"
          DEPLOY_ROOT="${DEPLOY_ROOT:-/root/docker/blog-frontend}"
          ssh -i ~/.ssh/deploy_key -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_HOST" \
            "DEPLOY_ROOT='$DEPLOY_ROOT' \
             WEB_IMAGE_REF='$WEB_IMAGE_REF' \
             REGISTRY='${{ env.REGISTRY }}' \
             REGISTRY_USERNAME='${{ env.REGISTRY_USERNAME }}' \
             REGISTRY_PASSWORD='${{ secrets.TENCENT_REGISTRY_PASSWORD }}' \
             bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_ROOT/web"
          if [ ! -f .env ]; then
            echo "缺少 $DEPLOY_ROOT/web/.env，请先在服务器创建 Web 运行时环境变量文件。"
            exit 1
          fi

          printf 'BLOG_WEB_IMAGE=%s\n' "$WEB_IMAGE_REF" > .deploy.env
          printf '%s\n' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          docker compose --env-file .env --env-file .deploy.env pull blog-web
          docker compose --env-file .env --env-file .deploy.env up -d --remove-orphans blog-web
          docker compose --env-file .env --env-file .deploy.env ps blog-web
          docker image prune -f

          cd "$DEPLOY_ROOT/admin"
          rm -rf .release
          mkdir -p .release
          tar -xzf admin-dist.tar.gz -C .release
          find . -mindepth 1 -maxdepth 1 \
            ! -name .release \
            ! -name .env \
            -exec rm -rf {} +
          cp -a .release/. .
          rm -rf .release admin-dist.tar.gz
          REMOTE
